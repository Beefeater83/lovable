# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    upload_dir: '%kernel.project_dir%/public/uploads/products'
    frontend_url: '%env(FRONTEND_URL)%'
    passkey_rp_id: '%env(default:default_passkey_rp_id:PASSKEY_RP_ID)%'
    passkey_rp_name: '%env(default:default_passkey_rp_name:PASSKEY_RP_NAME)%'
    passkey_origins: '%env(default:default_passkey_origins:PASSKEY_ORIGINS)%'
    default_passkey_rp_id: 'localhost'
    default_passkey_rp_name: 'Security'
    default_passkey_origins: 'http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173,https://security.diakonov-it.com.ua'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Model/'
            - '../src/Exception/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\EventListener\ResourceNotFoundExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\EventListener\PayloadValidationExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Services\ImageStorageService:
        arguments:
            $uploadDir: '%upload_dir%'


    App\EventListener\ProductAfterDeleteListener:
        tags:
            - { name: kernel.event_listener, event: 'products.delete.after_remove',  method: onAfterDelete }

    App\Security\OAuthAuthenticator:
        arguments:
            $frontendUrl: '%frontend_url%'
            $logger: '@monolog.logger.security'

    App\Security\OtpAuthenticator:
        arguments:
            $logger: '@monolog.logger.security'

    App\Security\ProductVoter:
        arguments:
            $logger: '@monolog.logger.security'

    App\Services\OtpService:
        arguments:
            $logger: '@monolog.logger.security'

    App\EventListener\ProductBeforeDeleteListener:
        tags:
            - { name: kernel.event_listener, event: 'products.delete.before_remove',  method: onBeforeDelete }

    App\EventListener\ProductBeforePatchListener:
        tags:
            - { name: kernel.event_listener, event: 'products.patch.before_persist',  method: onBeforePersist }

    App\Services\PasskeyService:
        arguments:
            $rpId: '%passkey_rp_id%'
            $rpName: '%passkey_rp_name%'
            $allowedOrigins: '%passkey_origins%'
            $logger: '@monolog.logger.security'

    App\Controller\Api\PasskeyController:
        arguments:
            $logger: '@monolog.logger.security'

