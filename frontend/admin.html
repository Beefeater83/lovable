<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a href="index.html" class="admin-link">Back</a>
        <button class="admin-link" onclick="exportXlsx()">Export XLSX</button>

        <div class="auth-container">
            <button id="auth-btn" class="admin-link" onclick="openAuthModal()">
                Authenticate
            </button>

            <button id="logout-btn" class="admin-link" onclick="logoutAdmin()">
                Logout
            </button>
        </div>

        <div id="auth-modal" class="auth-modal">
            <div class="auth-modal-content">

                <h2>Choose authentication</h2>

                <button class="auth-provider" onclick="loginWithGoogle()">
                    <img src="icons/google.svg" alt="Google">
                    <span>Continue with Google</span>
                </button>

                <button class="auth-provider" onclick="loginWithGithub()">
                    <img src="icons/github.svg" alt="GitHub">
                    <span>Continue with GitHub</span>
                </button>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <div class="otp-login">

                    <h3>Sign in with one-time code</h3>

                    <input
                            id="otp-email"
                            class="auth-input"
                            type="email"
                            placeholder="Email address"
                    />

                    <button
                            class="auth-provider otp-btn"
                            onclick="requestOtp()">
                        Send verification code
                    </button>

                    <div id="otp-section" class="otp-section" hidden>

                        <input
                                id="otp-code"
                                class="auth-input"
                                type="text"
                                maxlength="6"
                                placeholder="Verification code"
                        />

                        <button
                                class="auth-provider otp-btn"
                                onclick="verifyOtp()">
                            Verify and sign in
                        </button>

                    </div>

                    <div id="otp-message" class="otp-message"></div>
                </div>

                <button class="auth-cancel" onclick="closeAuthModal()">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <h1>
        Admin Panel
        <span id="admin-user"></span>
    </h1>

    <div id="admin-error" style="color:red; margin-bottom:10px;"></div>

    <div id="admin-content"></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
